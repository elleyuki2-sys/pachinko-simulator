<!doctype html><html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020"><title>パチンコシミュレーター Ver.1.1</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:#080c16;color:#f4f7ff;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}.app{max-width:520px;min-height:100vh;margin:auto;background:linear-gradient(#111827,#070b13);padding-bottom:24px}header{padding:18px 16px 12px;border-bottom:1px solid #29364d;position:sticky;top:0;background:#111827f2;z-index:5}h1{font-size:21px;margin:0}.sub,.note,.muted{color:#9aa8bd;font-size:11px}.tabs{display:flex;gap:8px;padding:12px 14px 4px}.tab{flex:1;padding:10px;border-radius:12px;border:1px solid #29364d;background:#182237;color:#cbd5e1;font-weight:800}.tab.active{background:#3578ff;color:white}.card{margin:10px 14px;padding:14px;border:1px solid #29364d;background:#121a2a;border-radius:16px}.hidden{display:none!important}.screen{height:210px;border-radius:14px;border:1px solid #35435d;background:radial-gradient(circle,#274578,#070b13 70%);display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center}.display{font-size:40px;font-weight:900;margin:8px}.msg{color:#bfdbfe}.primary{width:100%;padding:17px;border:0;border-radius:13px;background:linear-gradient(135deg,#246bff,#713cff);color:#fff;font-size:22px;font-weight:900}.grid,.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}.grid{margin-top:10px}.stat{background:#0c1321;border-radius:12px;padding:10px}.stat span{font-size:11px;color:#9aa8bd}.stat b{display:block;font-size:20px;margin-top:3px}.row{display:flex;gap:8px}.row>*{flex:1}.small,.apply{padding:11px;border:0;border-radius:10px;font-weight:800}.small{background:#26334a;color:#fff}.danger{background:#7f1d1d}.log{height:145px;overflow:auto;background:#080d17;border-radius:10px;padding:9px;font-size:12px;line-height:1.7}.win{color:#ffc928}.info{color:#93c5fd}.lose{color:#94a3b8}label{display:block;color:#aebbd0;font-size:12px;margin:9px 0 5px}input,select{width:100%;padding:11px;border:1px solid #3a4860;border-radius:10px;background:#0a101d;color:#fff;font-size:16px}.apply{width:100%;margin-top:12px;background:#3578ff;color:white}
</style><link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="パチンコSim">
</head><body><div class="app">
<header><h1>🎰 パチンコシミュレーター</h1><div class="sub">Ver.1.1 / スマホブラウザ版</div></header>
<div class="tabs"><button id="tabPlay" class="tab active">▶ 遊技</button><button id="tabSpec" class="tab">⚙ スペック</button></div>
<section id="playPage"><div class="card"><div class="muted" id="mode">通常時</div><div class="screen"><div class="display" id="display">READY</div><div class="msg" id="message">STARTを押してください</div></div><div style="height:10px"></div><button id="startBtn" class="primary">START / 1回転</button>
<div class="grid"><div class="stat"><span>通常時回転数</span><b id="normalSpins">0</b></div><div class="stat"><span>総回転数</span><b id="totalSpins">0</b></div><div class="stat"><span>持ち玉</span><b id="balls">0</b></div><div class="stat"><span>投資額</span><b id="investment">¥0</b></div><div class="stat"><span>大当り回数</span><b id="hits">0</b></div><div class="stat"><span>連チャン</span><b id="streak">0</b></div><div class="stat"><span>現在収支</span><b id="profit">¥0</b></div><div class="stat"><span>最大ハマり</span><b id="maxDry">0</b></div></div></div>
<div class="card"><div class="row"><button id="spin100" class="small">100回転</button><button id="spin1000" class="small">1,000回転</button><button id="resetBtn" class="small danger">リセット</button></div></div>
<div class="card"><div class="note">遊技ログ</div><div id="log" class="log"></div></div></section>
<section id="specPage" class="hidden"><div class="card"><label>プリセット</label><select id="preset"><option value="custom">カスタム</option><option value="s319">サンプル 1/319</option><option value="s199">サンプル 1/199</option><option value="s129">サンプル 1/129</option></select>
<div class="grid2"><div><label>大当り確率 1/</label><input id="prob" type="number" value="319.7" step="0.1"></div><div><label>RUSH突入率 %</label><input id="entry" type="number" value="50" step="0.1"></div><div><label>RUSH継続率 %</label><input id="cont" type="number" value="75" step="0.1"></div><div><label>RUSH回数</label><input id="st" type="number" value="0"></div><div><label>消費玉/回転</label><input id="cost" type="number" value="3" step="0.1"></div><div><label>通常大当り出玉</label><input id="payout" type="number" value="1500"></div><div><label>RUSH出玉</label><input id="rushPayout" type="number" value="1500"></div><div><label>千円あたり回転数</label><input id="rate" type="number" value="20" step="0.1"></div></div>
<label>初当り後</label><select id="entryMode"><option value="percent">RUSH突入率で抽選</option><option value="always">必ずRUSH</option><option value="never">RUSH非突入</option></select>
<button id="applyBtn" class="apply">このスペックを適用</button><p class="note">Ver.1.1は抽選を簡略化したモデルです。特図1/2の細かな振り分け、LT、C時短、V入賞などは未再現です。</p></div><div class="card"><div class="note">現在の設定</div><div id="summary"></div></div></section>
</div>
<script>
(function(){
var spec={prob:319.7,entry:50,cont:75,st:0,cost:3,payout:1500,rushPayout:1500,rate:20,entryMode:"percent"};
var s={total:0,normal:0,balls:0,hits:0,streak:0,inRush:false,dry:0,maxDry:0,investment:0};
function $(x){return document.getElementById(x)} function num(x){return parseFloat($(x).value)||0}
function money(n){return Math.round(n).toLocaleString("ja-JP",{style:"currency",currency:"JPY",maximumFractionDigits:0})}
function summary(){$("summary").textContent="大当り 1/"+spec.prob+"｜RUSH突入 "+spec.entry+"%｜継続 "+spec.cont+"%｜通常出玉 "+spec.payout+"玉｜RUSH出玉 "+spec.rushPayout+"玉｜"+spec.rate+"回/千円"}
function update(){var v=s.balls*250/3-s.investment;$("normalSpins").textContent=s.normal.toLocaleString();$("totalSpins").textContent=s.total.toLocaleString();$("balls").textContent=Math.floor(s.balls).toLocaleString();$("investment").textContent=money(s.investment);$("hits").textContent=s.hits;$("streak").textContent=s.streak;$("maxDry").textContent=s.maxDry;$("profit").textContent=money(v);$("profit").style.color=v>=0?"#34d399":"#f87171";$("mode").textContent=s.inRush?"🔥 RUSH中":"通常時"}
function add(t,c){var d=document.createElement("div");d.textContent=t;d.className=c||"";$("log").prepend(d)}
function normal(){s.total++;s.normal++;s.balls-=spec.cost;s.investment+=250/spec.rate;s.dry++;s.maxDry=Math.max(s.maxDry,s.dry);if(Math.random()<1/spec.prob){s.hits++;s.dry=0;s.streak=1;s.balls+=spec.payout;var e=spec.entryMode==="always"||(spec.entryMode==="percent"&&Math.random()<spec.entry/100);if(e){s.inRush=true;$("display").textContent="BIG BONUS";$("message").textContent="🔥 RUSH突入！";add(s.normal+"回転：大当り → RUSH突入！","win")}else{$("display").textContent="BIG BONUS";$("message").textContent="RUSH非突入";add(s.normal+"回転：大当り → 通常","win")}}else{$("display").textContent="−";$("message").textContent="もう一回！"}}
function rush(){s.total++;s.balls-=spec.cost;if(Math.random()<spec.cont/100){s.hits++;s.streak++;s.balls+=spec.rushPayout;$("display").textContent="RUSH BONUS";$("message").textContent=s.streak+"連チャン！";add("RUSH "+s.streak+"連：継続 +"+spec.rushPayout+"玉","win")}else{s.inRush=false;add("RUSH終了："+s.streak+"連","lose");s.streak=0;$("display").textContent="RUSH END";$("message").textContent="通常時へ"}}
function spin(){if(s.inRush)rush();else normal();update()}
function batch(n){for(var i=0;i<n;i++)spin();add(n.toLocaleString()+"回転を実行","info")}
function reset(){s={total:0,normal:0,balls:0,hits:0,streak:0,inRush:false,dry:0,maxDry:0,investment:0};$("display").textContent="READY";$("message").textContent="STARTを押してください";$("log").innerHTML="";update()}
$("tabPlay").onclick=function(){$("playPage").classList.remove("hidden");$("specPage").classList.add("hidden");$("tabPlay").classList.add("active");$("tabSpec").classList.remove("active")}
$("tabSpec").onclick=function(){$("specPage").classList.remove("hidden");$("playPage").classList.add("hidden");$("tabSpec").classList.add("active");$("tabPlay").classList.remove("active")}
$("startBtn").onclick=spin;$("spin100").onclick=function(){batch(100)};$("spin1000").onclick=function(){batch(1000)};$("resetBtn").onclick=reset;
$("applyBtn").onclick=function(){spec={prob:Math.max(1,num("prob")),entry:Math.max(0,Math.min(100,num("entry"))),cont:Math.max(0,Math.min(100,num("cont"))),st:Math.max(0,num("st")),cost:Math.max(0,num("cost")),payout:Math.max(0,num("payout")),rushPayout:Math.max(0,num("rushPayout")),rate:Math.max(.1,num("rate")),entryMode:$("entryMode").value};summary();reset();$("tabPlay").click()}
$("preset").onchange=function(){var p={s319:[319.7,50,75,3,1500,1500,20],s199:[199.7,50,80,3,1500,1500,20],s129:[129.7,50,75,3,1000,1000,22]}[this.value];if(!p)return;["prob","entry","cont","cost","payout","rushPayout","rate"].forEach(function(k,i){$(k).value=p[i]})}
summary();update();
})();
</script><script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(() => {});
  });
}
</script>
</body></html>
